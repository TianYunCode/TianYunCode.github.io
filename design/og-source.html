<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: #fbfaf7;
        color: #1b1e23;
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        letter-spacing: 0.04em;
        color: #8b929d;
      }
      .mark i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: #2f5fd0;
        display: block;
      }
      h1 {
        font-family: "Iowan Old Style", Palatino, Georgia, "Songti SC", "SimSun", serif;
        font-size: 92px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 28px;
      }
      p {
        font-size: 32px;
        line-height: 1.6;
        color: #5a616c;
        max-width: 900px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 26px;
        color: #8b929d;
        border-top: 2px solid #e3e0d8;
        padding-top: 28px;
      }
      .foot b {
        color: #2f5fd0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="mark"><i></i>拾光集</div>
    <div>
      <h1>拾光集</h1>
      <p>一个人的技术笔记与生活记录 · Astro 构建，GitHub Pages 托管</p>
    </div>
    <div class="foot">
      <span><b>wty.blogs.abrdns.com</b></span>
      <span>一个人的技术笔记与实测记录</span>
    </div>
  </body>
</html>
